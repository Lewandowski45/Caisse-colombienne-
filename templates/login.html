<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Connexion — La Caisse d'Épargne Colombienne 🇨🇴</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-sm">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-extrabold text-slate-900">La Caisse d'Épargne Colombienne 🇨🇴</h1>
            <p class="text-slate-500 text-sm mt-1">Connexion requise</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="space-y-2 mb-4">
                    {% for category, message in messages %}
                        <div class="rounded-xl px-4 py-3 shadow-sm border text-sm
                            {% if category == 'success' %}
                                bg-emerald-50 text-emerald-800 border-emerald-200
                            {% elif category == 'danger' %}
                                bg-rose-50 text-rose-800 border-rose-200
                            {% else %}
                                bg-blue-50 text-blue-800 border-blue-200
                            {% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Numéro de téléphone</label>
                <input type="tel" name="username" required autofocus
                       class="w-full border border-slate-200 rounded-xl px-4 py-3 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Mot de passe</label>
                <input type="password" name="password" required
                       class="w-full border border-slate-200 rounded-xl px-4 py-3 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl">
                Se connecter
            </button>
        </form>

        <p class="text-center text-sm text-slate-500 mt-4">
            Pas encore de compte ? <a href="{{ url_for('inscription') }}" class="font-bold text-indigo-600">S'inscrire</a>
        </p>
    </div>

</body>
</html>
